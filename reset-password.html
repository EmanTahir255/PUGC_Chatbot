<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | PUGC SmartBot</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Global Styles -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Forgot Password Styles (Reusing for consistency) -->
    <link rel="stylesheet" href="css/forgot-password.css">
</head>
<body>

    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Reset Section -->
    <section class="forgot-section">
        <div class="forgot-container">

            <!-- Info -->
            <div class="forgot-info">
                <h1>Set New Password</h1>
                <p>
                    Please enter your new password below. Make sure it's secure and something you'll remember.
                </p>

                <ul>
                    <li><i class="fas fa-check-circle"></i> Minimum 8 characters</li>
                    <li><i class="fas fa-check-circle"></i> At least one number</li>
                    <li><i class="fas fa-check-circle"></i> Special characters allowed</li>
                </ul>
            </div>

            <!-- Form -->
            <div class="forgot-form-box">
                <h2>New Password</h2>

                <form class="forgot-form" id="resetPasswordForm">
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="reset-password" placeholder="Enter new password" required>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-shield-alt"></i>
                        <input type="password" id="reset-confirm-password" placeholder="Confirm new password" required>
                    </div>

                    <button type="submit" class="reset-btn">
                        <i class="fas fa-save"></i> Update Password
                    </button>

                    <div id="resetStatus" class="form-status" style="display:none; margin-top:15px; text-align:center;"></div>

                    <p class="back-link">
                        <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
                    </p>
                </form>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="js/main.js"></script>
    <script src="js/auth-validation.js"></script>
</body>
</html>
